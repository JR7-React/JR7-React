<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Audiowide&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
      .main-text { font-family: 'Audiowide', cursive; }
      .tagline { font-family: 'Fira Code', monospace; }
      
      @keyframes rotate-rings {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-counter {
        from { transform: rotate(405deg); }
        to { transform: rotate(45deg); }
      }
      @keyframes color-cycle {
        0% { stroke: #FF0080; fill: #FF0080; }
        16.66% { stroke: #00ff00; fill: #00ff00; }
        33.33% { stroke: #7928CA; fill: #7928CA; }
        50% { stroke: #00ffff; fill: #00ffff; }
        66.66% { stroke: #ff00ff; fill: #ff00ff; }
        83.33% { stroke: #84CC16; fill: #84CC16; }
        100% { stroke: #FF0080; fill: #FF0080; }
      }
      @keyframes blink {
        0%, 90% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
        100% { transform: scaleY(1); }
      }
      .rings-group { 
        animation: rotate-rings 25s linear infinite, color-cycle 18s ease-in-out infinite;
        transform-origin: 50px 50px; 
      }
      .snake-group { 
        animation: rotate-counter 20s linear infinite;
        transform-origin: 50px 50px; 
      }
      .blink-eye { 
        animation: blink 5s infinite;
        transform-origin: 50px 50px; 
      }
    </style>
    
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="iris-grad">
      <stop offset="60%" stop-color="#FF0080">
        <animate attributeName="stop-color" values="#FF0080;#00ff00;#7928CA;#00ffff;#ff00ff;#84CC16;#FF0080" dur="18s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="black" stop-opacity="0.8" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="400" fill="#0f172a"/>
  
  <g transform="translate(300, 200)">
    <g transform="translate(-150, 0) scale(1.6)">
      <g transform="translate(-50, -50)">
        
        <!-- Anillos Atómicos -->
        <g class="rings-group">
          <ellipse cx="50" cy="50" rx="50" ry="14" fill="none" stroke="#FF0080" stroke-width="2.5"/>
          <ellipse cx="50" cy="50" rx="50" ry="14" transform="rotate(60 50 50)" fill="none" stroke="#FF0080" stroke-width="2.5"/>
          <ellipse cx="50" cy="50" rx="50" ry="14" transform="rotate(120 50 50)" fill="none" stroke="#FF0080" stroke-width="2.5"/>
          
          <!-- Letras -->
          <g font-family="Fira Code, monospace" font-size="8" font-weight="bold" fill="#FF0080" text-anchor="middle">
            <text x="71" y="14">J</text>
            <text x="92" y="50">R</text>
            <text x="71" y="86">7</text>
            <text x="29" y="86">D</text>
            <text x="8" y="50">E</text>
            <text x="29" y="14">V</text>
          </g>
        </g>
        
        <!-- Serpientes Orbitales -->
        <g class="snake-group" opacity="0.9">
          <ellipse cx="50" cy="50" rx="50" ry="14" fill="none" stroke="url(#grad1)" stroke-width="1.5" filter="url(#glow)">
            <animate attributeName="stroke-dasharray" values="0,300;300,0;300,0;0,300;0,300" keyTimes="0;0.25;0.58;0.83;1" dur="6s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="50" cy="50" rx="50" ry="14" transform="rotate(60 50 50)" fill="none" stroke="url(#grad1)" stroke-width="1.5" filter="url(#glow)">
            <animate attributeName="stroke-dasharray" values="0,300;300,0;300,0;0,300;0,300" keyTimes="0;0.25;0.58;0.83;1" dur="6s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="50" cy="50" rx="50" ry="14" transform="rotate(120 50 50)" fill="none" stroke="url(#grad1)" stroke-width="1.5" filter="url(#glow)">
            <animate attributeName="stroke-dasharray" values="0,300;300,0;300,0;0,300;0,300" keyTimes="0;0.25;0.58;0.83;1" dur="6s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        
        <!-- Ojo Central -->
        <g class="blink-eye">
          <circle cx="50" cy="50" r="11" fill="#000000" stroke="#94a3b8" stroke-width="1"/>
          <circle cx="50" cy="50" r="7.5" fill="url(#iris-grad)"/>
          <ellipse cx="50" cy="50" rx="2" ry="7.5" fill="black"/>
          <circle cx="53" cy="48" r="1.2" fill="white" opacity="0.9"/>
        </g>
        
      </g>
    </g>
    
    <!-- Línea Separadora -->
    <line x1="-40" y1="-50" x2="-40" y2="50" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>
    
    <!-- Texto -->
    <g transform="translate(-10, 0)">
      <text class="main-text" x="0" y="12" font-size="54" fill="#f8fafc" letter-spacing="2" stroke="#FF0080" stroke-width="0.8">
        JR7Dev
        <animate attributeName="stroke" values="#FF0080;#00ff00;#7928CA;#00ffff;#ff00ff;#84CC16;#FF0080" dur="18s" repeatCount="indefinite"/>
      </text>
      <text class="tagline" x="2" y="46" font-size="13" letter-spacing="4" fill="#FF0080">
        SOLUTIONS
        <animate attributeName="fill" values="#FF0080;#00ff00;#7928CA;#00ffff;#ff00ff;#84CC16;#FF0080" dur="18s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
